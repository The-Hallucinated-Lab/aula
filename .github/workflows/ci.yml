name: CI

# The same gate the pre-push hook runs, on a machine nobody can bypass.
# A hook is a courtesy; this is the contract.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first run's answer worthless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The hook installer skips itself in CI; the hooks are for humans.
  CI: 'true'

jobs:
  gate:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: the lockfile is the input, and a run that quietly
      # resolves a different tree is not testing what will ship.
      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      # The number that actually counts. `verify` re-derives every hard
      # scheduling invariant independently of the solver, so a solver bug
      # cannot mark its own homework.
      - name: Verify the engine
        run: npm run verify

      - name: Build (web)
        run: npm run build:web

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  licences:
    name: Licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Aula statically links what it ships, so a strong-copyleft runtime
      # dependency would relicense the application itself. This fails the build.
      - name: Audit licences
        run: npm run audit:licenses

      # Two audits, because they are two different risks.
      #
      # The shipped graph is what a timetable office installs and runs. Any
      # advisory in it is a defect in the product, so the bar is `low` and the
      # job fails.
      - name: Audit the shipped dependency graph
        run: npm audit --omit=dev --audit-level=low

      # The build graph runs in this trusted job and never reaches a user or
      # their data. Advisories in it are worth seeing and worth fixing on their
      # own schedule; failing the pipeline on one would mean a release train
      # blocked by a transitive dependency of a tool that only makes tags.
      # At the time of writing all seven findings are inside the copy of `npm`
      # that `semantic-release` bundles.
      - name: Audit the build graph (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: licence-report
          path: |
            reports/licenses.json
            THIRD-PARTY-NOTICES.md
          retention-days: 30

  # Which pull requests touch packaging at all?
  #
  # The installer job used to be main-only, so the pull request that broke it
  # was green and the merge was not. Running it on every pull request is a real
  # cost — electron-builder pulls ~200 MB — so it runs when the packaging
  # surface actually changes, and always on main.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.changed.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          if echo "$files" | grep -qE '^(package\.json|package-lock\.json|apps/desktop/package\.json|apps/desktop/electron/|tools/scripts/audit-licenses\.mjs|\.github/workflows/ci\.yml)'; then
            echo "packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "packaging=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed files:"; echo "$files"

  package:
    name: Windows installer
    if: needs.scope.outputs.packaging == 'true'
    needs: [gate, licences, scope]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Package
        run: npm run package
        env:
          # electron-builder would otherwise try to publish to a release.
          GH_TOKEN: ''

      - uses: actions/upload-artifact@v4
        with:
          name: aula-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          retention-days: 30
