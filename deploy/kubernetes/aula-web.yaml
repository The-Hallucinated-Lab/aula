# Aula — browser build on Kubernetes.
#
# For a review environment or a public demonstration. An institution runs the
# desktop application; nothing here schedules a timetable, it serves the
# renderer as static files.
#
#   kubectl apply -f deploy/kubernetes/aula-web.yaml
#
# Self-healing here is the platform's job, and this manifest's job is to give
# it enough to do it correctly: a liveness probe so a wedged process is
# replaced, a readiness probe so a starting pod takes no traffic, and a
# disruption budget so a node drain cannot take the last replica with it.

apiVersion: v1
kind: Namespace
metadata:
  name: aula
  labels:
    app.kubernetes.io/name: aula
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aula-web
  namespace: aula
  labels:
    app.kubernetes.io/name: aula
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aula
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the current count during a roll: the pods are 40 MB
      # and start in under a second, so there is no reason to accept a dip.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aula
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/the-hallucinated-lab/aula:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080

          # Static files. It needs no filesystem, no capabilities and no
          # privilege escalation, so it gets none of them.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }

          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }

          # Startup first, so a slow start is not mistaken for a hang and
          # restarted into a loop.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 10
            periodSeconds: 2

          # Liveness answers "is this process wedged" — restart it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness answers "should this pod get traffic" — a different
          # question, which is why it is a different probe.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 16Mi } }
        - { name: nginx-run, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: aula-web
  namespace: aula
spec:
  selector:
    app.kubernetes.io/name: aula
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aula-web
  namespace: aula
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aula
      app.kubernetes.io/component: web
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aula-web
  namespace: aula
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aula
      app.kubernetes.io/component: web
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { protocol: TCP, port: 8080 }
  # The renderer talks to nothing. An empty egress list says so to the cluster
  # as well as to the browser, so a compromised pod has nowhere to call.
  egress: []
