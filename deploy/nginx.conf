# Aula — static host for the browser build.
#
# The renderer talks to nothing, which is what makes the policy below as tight
# as it is: `connect-src 'none'` is not a compromise here, it is a description.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx tells the world its version on every response and every error page.
    server_tokens off;

    # ---- security headers ---------------------------------------------------
    #
    # The desktop build carries its CSP in the document, because `file://` has
    # no response headers. Served over HTTP there are headers, and a header
    # beats a meta tag: it cannot be stripped by injected markup.

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'none'; worker-src 'self' blob:; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Aula needs no device permission of any kind. Saying so here means a
    # compromised page cannot even raise the prompt.
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

    # ---- caching ------------------------------------------------------------
    #
    # Vite fingerprints every asset, so they are immutable by construction.
    # index.html is not fingerprinted and must never be cached, or a browser
    # keeps pointing at a build that no longer exists.

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Routing is hash-based (`#/timetable`), so the server only ever serves one
    # document. The fallback is for a stray deep link, not for a router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fonts are already compressed; gzipping woff2 costs CPU and saves nothing.
    location ~* \.(woff2?|png|jpg|svg)$ {
        gzip off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
